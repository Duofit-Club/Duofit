<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--
    IMPORTANT: this is a client-side-rendered app (no SSR/prerendering), so
    this static head is the ONLY thing crawlers that don't execute JavaScript
    ever see — Bing, and every social link-preview bot (Facebook, WhatsApp,
    LinkedIn, X/Twitter, Slack, iMessage). Google DOES execute JS and will
    also pick up each route's own head() tags (see src/lib/seo.ts), but for
    every other crawler, THIS is the title/description/image they'll show —
    for every single page on the site, since they never get past this file.
    Keep this as strong, general home-page copy for that reason.
  -->

  <title>DUOFIT — Health, Designed to Last. | Nutrition & Fitness Coaching</title>
  <meta name="description"
    content="DUOFIT is a health and lifestyle coaching brand helping individuals, couples and families build healthier lives through practical nutrition, sustainable movement and lasting daily habits. Based in Hyderabad." />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#2E432E" />
  <link rel="canonical" href="https://www.duofit.club/" />

  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4YM84LY2MX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-4YM84LY2MX');
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Sans+3:wght@300;400;500;600&display=swap"
    rel="stylesheet" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="DUOFIT" />
  <meta property="og:title" content="DUOFIT — Health, Designed to Last." />
  <meta property="og:description"
    content="Practical nutrition, sustainable movement and lasting daily habits — health coaching for individuals, couples and families in Hyderabad." />
  <meta property="og:url" content="https://www.duofit.club/" />
  <meta property="og:image" content="https://www.duofit.club/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="en_IN" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="DUOFIT — Health, Designed to Last." />
  <meta name="twitter:description"
    content="Practical nutrition, sustainable movement and lasting daily habits — health coaching for individuals, couples and families in Hyderabad." />
  <meta name="twitter:image" content="https://www.duofit.club/og-image.jpg" />

  <!--
    Structured data (JSON-LD) — static in the base HTML so every crawler
    type sees it, not just JS-executing ones. This is the strongest single
    signal for Google to confidently match a brand-name search ("duofit")
    to this exact site rather than treating it as an unknown/ambiguous page.
  -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "@id": "https://www.duofit.club/#organization",
    "name": "DUOFIT",
    "alternateName": "Duofit Club",
    "url": "https://www.duofit.club",
    "logo": "https://www.duofit.club/duofit-logo.png",
    "image": "https://www.duofit.club/og-image.jpg",
    "description": "DUOFIT is a health and lifestyle coaching brand helping individuals, couples and families build healthier lives through practical nutrition, sustainable movement and lasting daily habits.",
    "email": "support@duofit.club",
    "telephone": "+91-9052853200",
    "priceRange": "₹₹",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Hyderabad",
      "addressRegion": "Telangana",
      "addressCountry": "IN"
    },
    "founder": [
      { "@type": "Person", "name": "Nitesh" },
      { "@type": "Person", "name": "Nikitha" }
    ],
    "sameAs": [
      "https://instagram.com/duofit.club"
    ],
    "areaServed": { "@type": "City", "name": "Hyderabad" }
  }
  </script>
</head>

<body>

</body>
